title: Asteroids Game Tutorial
description: Build your own Asteroids game in Python using Turtle Graphics
theme: just-the-docs

url: https://StefanUG.github.io
baseurl: /CodingPirates_Asteroids

# Color scheme for space theme
color_scheme: dark

# Enable search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Navigation structure
nav_sort: title

# Footer content
footer_content: "Copyright &copy; 2025 CodingPirates Asteroids Tutorial. Distributed under the MIT License."

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Aux links for the upper right navigation
aux_links:
  "View on GitHub":
    - "//github.com/StefanUG/CodingPirates_Asteroids"

# Makes Aux links open in a new tab
aux_links_new_tab: true

# Enable copy button on code
enable_copy_code_button: true

# Heading anchor links
heading_anchors: true
